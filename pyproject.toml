[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modelshift"
version = "0.1.0"
description = "ModelShift — LiteLLM-to-Bedrock GPT migration evaluation tool"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "boto3>=1.34",
    "httpx>=0.27",
    "PyYAML>=6.0",
    "reportlab>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "flake8>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["modelshift*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.flake8]
max-line-length = 120
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv", "web"]
